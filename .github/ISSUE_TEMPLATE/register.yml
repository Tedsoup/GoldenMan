name: Golden Man registration
description: Register a SkyBlock profile for Golden Man verification (opened automatically by the mod).
title: "Register "
labels: ["registration"]
body:
  - type: markdown
    attributes:
      value: |
        The mod filled this in for you. Before submitting, make sure **every API setting is ON**
        in SkyBlock (SkyBlock Menu → Settings → API Settings). Then click **Submit new issue**.
  - type: input
    id: username
    attributes:
      label: Username
    validations:
      required: true
  - type: input
    id: uuid
    attributes:
      label: UUID
    validations:
      required: true
  - type: input
    id: profile_id
    attributes:
      label: Profile ID
    validations:
      required: true
